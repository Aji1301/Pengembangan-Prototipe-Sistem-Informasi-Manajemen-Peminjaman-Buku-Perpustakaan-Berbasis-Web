version: '3.8'

services:
  web:
    build:
      context: .
      target: development
    # Kita menggunakan port 5173 (default Vite) dan 8443 (referensi di AGENTS.md)
    ports:
      - "5173:5173"
      - "8443:8443"
    volumes:
      # Sinkronisasi folder lokal dengan folder /app di dalam container (Hot Reload)
      - .:/app
      # Mencegah node_modules di dalam container tertimpa oleh folder lokal
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Polling mungkin diperlukan untuk hot-reload jika Anda menggunakan Windows/WSL
      - CHOKIDAR_USEPOLLING=true

  server:
    build:
      context: ./server
      target: development
    ports:
      - "5050:5050"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5050
      # Asumsi database berjalan secara lokal (host)
      - DATABASE_URL=mysql://root:@host.docker.internal:3306/library_kancil?schema=public
    # Menghubungkan host localhost agar docker container bisa akses mysql di host
    extra_hosts:
      - "host.docker.internal:host-gateway"
